<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Seyalini</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F1EC;color:#17171A;font-family:system-ui,sans-serif}
form{background:#fff;border:1px solid #E2DED6;border-radius:14px;padding:28px;width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:24px}p{margin:0;color:#5C5850}
label{font-size:13px;font-weight:500}input{height:42px;border:1px solid #CFCAC0;border-radius:8px;padding:0 10px;font:inherit}
button{height:44px;border:0;border-radius:8px;background:#17171A;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:#B42318;font-size:13px}
</style>
</head>
<body>
<form method="post">{% csrf_token %}
  <h1>Seyalini</h1><p>Your AI workshop</p>
  {% if form.errors %}<div class="err">Wrong username or password.</div>{% endif %}
  <label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required autofocus>
  <label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  {% if allow_signup %}<p style="font-size:13px">New here? <a href="/signup/">Create your organisation</a></p>{% endif %}
</form>
</body>
</html>
