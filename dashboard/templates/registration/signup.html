<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create your organisation · Seyalini</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F1EC;color:#17171A;font-family:system-ui,sans-serif}
form{background:#fff;border:1px solid #E2DED6;border-radius:14px;padding:28px;width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:24px}p{margin:0 0 6px;color:#5C5850}label{font-size:13px;font-weight:600}
input{height:42px;border:1px solid #CFCAC0;border-radius:8px;padding:0 10px;font:inherit}
button{height:44px;border:0;border-radius:8px;background:#17171A;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
.err{color:#B42318;font-size:12px}
</style></head>
<body><form method="post">{% csrf_token %}
<h1>Create your organisation</h1><p>Your own AI marketing team. You'll add your Gemini key and your app next.</p>
{% for f in form %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}{% endfor %}
<button type="submit">Create</button><p style="font-size:13px">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</form></body></html>
