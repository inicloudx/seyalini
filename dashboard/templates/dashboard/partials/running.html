<div id="running" {% if running %}hx-get="{% url 'dashboard:running' %}" hx-trigger="every 4s" hx-swap="outerHTML"{% endif %}>
  {% if running %}
  <section class="note info row" aria-live="polite" style="gap:10px">
    <span class="dot" style="animation:pulse 1.4s infinite"></span>
    <span><b>Working:</b> {% for t in running %}{{ t.title|cut:"[Sample] "|truncatechars:50 }}{% if not forloop.last %} · {% endif %}{% endfor %}. This page updates by itself.</span>
  </section>
  {% endif %}
</div>
