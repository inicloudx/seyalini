# Inside nginx (container seyalini_nginx, no public ports). Earnly's nginx does https and forwards here.
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;                   # logo / screenshot uploads

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # generated videos and images, straight from the data volume (URLs are hard to guess)
    location /media/ {
        alias /app/data/media/;
        expires 7d;
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_x_real_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;   # "https", set by Earnly's nginx
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
