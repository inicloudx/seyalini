# /etc/nginx/sites-available/seyalini  (setup.sh installs it; certbot --nginx adds the https part)
# Seyalini has its own server and subdomain, so this is the whole site: nothing else lives here.

server {
    listen 80;
    listen [::]:80;
    server_name seyalini.inixr.com;

    client_max_body_size 50m;                   # logo / screenshot uploads

    # generated videos and images (served straight from disk)
    location /media/ {
        alias /opt/seyalini/data/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
