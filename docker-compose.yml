# Seyalini on the server it shares with Earnly (seyalini.inixr.com).
# Start / update:  ./deploy.sh        Logs:  docker compose logs -f worker
#
# Earnly's nginx owns ports 80/443 and https; it forwards seyalini.inixr.com to `seyalini_nginx` here
# over Earnly's Docker network. Memory limits keep Seyalini inside its share of the 1 GB server: when it
# needs more (a video render) it uses swap and gets slow, it never takes memory Earnly needs.
name: seyalini

services:

  # ── The job queue (tiny, nothing saved to disk) ─────────────
  redis:
    image: redis:7-alpine
    container_name: seyalini_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    mem_limit: 64m

  # ── The web app (Django + gunicorn) ──────────────────────────
  web:
    build: .
    image: seyalini:latest
    container_name: seyalini_web
    restart: always
    env_file: .env
    volumes:
      - seyalini_data:/app/data            # database, videos, tenants (logos, briefs, settings)
      - seyalini_static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - redis
    mem_limit: 300m
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── The agents: one job at a time + the daily clock (06:00 Scout, 07:00 script, 21:00 Analyst) ──
  # It sleeps when there is no work (WORKER_SLEEPS=1): it stops itself after 15 quiet minutes outside the
  # work windows, and deploy/worker-wake.sh (cron, every minute) starts it when a window opens or a job
  # waits. So most of the day Earnly has the whole server.
  worker:
    image: seyalini:latest
    container_name: seyalini_worker
    restart: on-failure                    # a crash restarts it; going to sleep (exit 0) does not
    cpu_shares: 512                        # when both apps want the CPU, Earnly goes first
    env_file: .env
    # solo pool = one process (small memory); -B = the clock runs inside it
    command: ["celery", "-A", "config", "worker", "-B", "--pool=solo", "--loglevel=info",
              "--schedule=/app/data/celerybeat-schedule"]
    volumes:
      - seyalini_data:/app/data
    depends_on:
      web:
        condition: service_healthy         # the web container has prepared the database
    mem_limit: 600m
    memswap_limit: 3g

  # ── Inside nginx: serves videos and static files, passes the rest to the web app. No public ports. ──
  nginx:
    image: nginx:1.27-alpine
    container_name: seyalini_nginx
    restart: always
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - seyalini_static:/app/staticfiles:ro
      - seyalini_data:/app/data:ro
    depends_on:
      - web
    networks:
      - default
      - earnly
    mem_limit: 48m

networks:
  earnly:                                  # Earnly's network: its nginx reaches seyalini_nginx through it
    external: true
    name: earnly_default

volumes:
  seyalini_data:
  seyalini_static:
